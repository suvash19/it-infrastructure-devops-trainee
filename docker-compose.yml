services:

  nginx:
    build:
      context: ./nginx
    container_name: devops-nginx
    ports:
      - "80:80"
    depends_on:
      - app
    networks:
      - devops-network
    restart: unless-stopped

  app:
    build:
      context: ./app
    container_name: devops-app
    expose:
      - "5000"
    environment:
      DB_HOST: db
      POSTGRES_DB: devopsdb
      POSTGRES_USER: devopsuser
      POSTGRES_PASSWORD: devopspass
    depends_on:
      db:
        condition: service_healthy
    networks:
      - devops-network
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: devops-db
    environment:
      POSTGRES_DB: devopsdb
      POSTGRES_USER: devopsuser
      POSTGRES_PASSWORD: devopspass
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - devops-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devopsuser -d devopsdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    command:
      - '--path.rootfs=/host'
    volumes:
      - '/:/host:ro,rslave'
    expose:
      - "9100"
    networks:
      - devops-network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - node-exporter
    networks:
      - devops-network
    restart: unless-stopped

volumes:
  postgres-data:

networks:
  devops-network:
    driver: bridge
